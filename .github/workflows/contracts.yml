name: C++ contracts

on:
  workflow_dispatch:
    inputs:
      test_preset:
        description: CPU checks or the complete suite requiring additional memory and scratch
        type: choice
        default: cpu
        options: [cpu, contracts]
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  MPLBACKEND: Agg

jobs:
  checks:
    name: Inputs and documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      contracts: ${{ steps.plan.outputs.contracts }}
      matching_qualification: ${{ steps.plan.outputs.matching_qualification }}
      revision: ${{ steps.sdk.outputs.revision }}
      python_revision: ${{ steps.sdk.outputs.python_revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read the recorded SDK revision
        id: sdk
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          lock = pathlib.Path('cmake/RexGraph.lock.cmake').read_text()
          revision = re.search(r'GADGET_QUALIFIED_REXGRAPH_REVISION\s+"([0-9a-f]{40})"', lock)
          if revision is None:
              raise ValueError('SDK source revision is missing from the dependency lock')
          python_revision = re.search(r'GADGET_QUALIFIED_REXGRAPH_PYTHON_REVISION\s+"([0-9a-f]{40})"', lock)
          if python_revision is None:
              raise ValueError('Python source revision is missing from the dependency lock')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('revision=' + revision.group(1) + '\n')
              output.write('python_revision=' + python_revision.group(1) + '\n')
          PY
      - name: Select native qualification
        id: plan
        env:
          # Checkout and GITHUB_SHA use the tested PR merge snapshot.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci_checks.py plan --base "$BASE_SHA" --head "$GITHUB_SHA" --output "$GITHUB_OUTPUT"
      - name: Check CI selection and documentation
        run: |
          python3 tests/ci_checks.py
          python3 tests/publication.py
          python3 tools/check_publication.py --history
          python3 tools/ci_checks.py docs
          python3 tests/dependency.py
          python3 tests/source_export.py "$RUNNER_TEMP/source-export-contracts"
  python-wheels:
    name: Native Python wheels
    needs: checks
    if: needs.checks.outputs.contracts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sirtrott1/rexgraph-cpp
          ref: ${{ needs.checks.outputs.revision }}
          path: .rfc-source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sirtrott1/rexgraph-python
          ref: ${{ needs.checks.outputs.python_revision }}
          path: .python-source
          persist-credentials: false
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ pkg-config libgmp-dev libopenblas-dev python3-venv
      - name: Admit compiler resources
        run: python3 tools/ci_checks.py resources --requested "${{ vars.GADGET_BUILD_JOBS || '3' }}" --output "$GITHUB_ENV"
      - name: Identify the wheel toolchain
        id: abi
        run: |
          python3 - <<'PY'
          import hashlib, os, subprocess, sys, sysconfig
          inputs = [sys.version, sysconfig.get_config_var('SOABI'),
                    subprocess.check_output(['g++', '--version'], text=True),
                    subprocess.check_output(['dpkg-query', '-W', 'libgmp-dev', 'libopenblas-dev', 'libc6-dev'], text=True)]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('digest=' + hashlib.sha256('\n'.join(inputs).encode()).hexdigest() + '\n')
          PY
      - name: Restore native wheels
        id: wheels
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: .cache/native-wheels
          key: wheels-${{ runner.os }}-${{ runner.arch }}-${{ steps.abi.outputs.digest }}-${{ needs.checks.outputs.revision }}-${{ needs.checks.outputs.python_revision }}
          restore-keys: |
            wheels-${{ runner.os }}-${{ runner.arch }}-${{ steps.abi.outputs.digest }}-${{ needs.checks.outputs.revision }}-${{ needs.checks.outputs.python_revision }}-
      - name: Build native wheels
        if: steps.wheels.outputs.cache-hit == ''
        run: |
          cmake -S .rfc-source -B "$RUNNER_TEMP/native-sdk-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DRFC_ENABLE_VULKAN=OFF \
            -DRFC_BUILD_APPS=OFF -DRFC_BUILD_LOCAL_TOOLS=OFF -DRFC_BUILD_TESTS=OFF \
            -DRFC_BUILD_BENCHMARKS=OFF -DRFC_BUILD_LEARNING=OFF -DRFC_BUILD_CAPABILITY_DEMO=OFF
          cmake --build "$RUNNER_TEMP/native-sdk-build" --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"
          cmake --install "$RUNNER_TEMP/native-sdk-build" --prefix "$RUNNER_TEMP/native-sdk"
          python3 -m venv "$RUNNER_TEMP/wheel-builder"
          builder="$RUNNER_TEMP/wheel-builder/bin/python"
          wheels="$GITHUB_WORKSPACE/.cache/native-wheels"
          mkdir -p "$wheels"
          "$builder" -m pip wheel --verbose --no-deps --wheel-dir "$wheels" ./.python-source \
            --config-settings="compile-args=-j$CMAKE_BUILD_PARALLEL_LEVEL"
          "$builder" -m pip wheel --verbose --no-deps --wheel-dir "$wheels" ./.python-source/bindings/cpp \
            --config-settings="build.tool-args=-j$CMAKE_BUILD_PARALLEL_LEVEL" \
            --config-settings="cmake.define.CMAKE_PREFIX_PATH=$RUNNER_TEMP/native-sdk"
          "$builder" -m pip wheel --no-deps --wheel-dir "$wheels" \
            ./.python-source/rcdb ./.python-source/rcql ./.python-source/agent
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-wheels
          path: .cache/native-wheels/*.whl
          retention-days: 3
  contracts:
    needs: checks
    if: needs.checks.outputs.contracts == 'true'
    runs-on: ${{ vars.GADGET_CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: ${{ github.event.inputs.test_preset == 'contracts' && 120 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    env:
      CONTRACT_TEST_PRESET: ${{ github.event.inputs.test_preset || 'cpu' }}
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPILERCHECK: content
      SDK_URL: ${{ vars.REXGRAPH_ARCHIVE_URL || secrets.REXGRAPH_ARCHIVE_URL }}
      SDK_SHA256: ${{ vars.REXGRAPH_ARCHIVE_SHA256 }}
      SDK_REPOSITORY: ${{ vars.REXGRAPH_ARCHIVE_REPOSITORY }}
      SDK_MODE: ${{ vars.REXGRAPH_SDK_MODE || 'source' }}
      SDK_SOURCE_REPOSITORY: ${{ vars.REXGRAPH_SOURCE_REPOSITORY || 'sirtrott1/rexgraph-cpp' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Retrieve the SDK archive
        if: env.SDK_MODE == 'archive' && env.SDK_REPOSITORY != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.REXGRAPH_ARCHIVE_REPOSITORY }}
          ref: ${{ vars.REXGRAPH_ARCHIVE_REF }}
          ssh-key: ${{ secrets.REXGRAPH_ARCHIVE_DEPLOY_KEY }}
          persist-credentials: false
          path: .rfc-download
      - name: Retrieve the independent SDK source
        if: env.SDK_MODE == 'source'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SDK_SOURCE_REPOSITORY }}
          ref: ${{ vars.REXGRAPH_SOURCE_REF || needs.checks.outputs.revision }}
          persist-credentials: false
          path: .rfc-source
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y ccache cmake ninja-build g++ clang pkg-config libgmp-dev libssl-dev libjson-c-dev libopenblas-dev python3-venv python3-numpy python3-sympy python3-scipy python3-jsonschema python3-matplotlib
      - name: Admit compiler resources
        run: python3 tools/ci_checks.py resources --requested "${{ vars.GADGET_BUILD_JOBS || '3' }}" --output "$GITHUB_ENV"
      - name: Restore compiler cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: .cache/ccache
          key: compile-${{ runner.os }}-${{ runner.arch }}-${{ matrix.compiler }}-${{ hashFiles('cmake/RexGraph.lock.cmake') }}-${{ github.sha }}
          restore-keys: |
            compile-${{ runner.os }}-${{ runner.arch }}-${{ matrix.compiler }}-${{ hashFiles('cmake/RexGraph.lock.cmake') }}-
      - name: Check the test environment
        run: /usr/bin/python3 tools/ci_checks.py preflight
      - name: Fetch the qualified SDK
        if: env.SDK_MODE == 'archive'
        shell: bash
        run: |
          if ! [[ "$SDK_SHA256" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo '::error::Configure REXGRAPH_ARCHIVE_SHA256 for the qualified SDK.'
            exit 1
          fi
          if test -n "$SDK_REPOSITORY"; then
            test -f .rfc-download/rexgraph-sdk.zip
            cp .rfc-download/rexgraph-sdk.zip "$RUNNER_TEMP/rexgraph.zip"
            rm -rf .rfc-download
          elif test -n "$SDK_URL"; then
            curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 --output "$RUNNER_TEMP/rexgraph.zip" "$SDK_URL"
          else
            echo '::error::Configure an SDK archive repository or HTTPS archive URL.'
            exit 1
          fi
          printf '%s  %s\n' "$SDK_SHA256" "$RUNNER_TEMP/rexgraph.zip" | sha256sum --check --strict
          python3 - "$RUNNER_TEMP/rexgraph.zip" "$RUNNER_TEMP/sdk" <<'PY'
          import pathlib, sys, zipfile
          target = pathlib.Path(sys.argv[2]).resolve()
          with zipfile.ZipFile(sys.argv[1]) as archive:
              for entry in archive.infolist():
                  path = target / entry.filename
                  if not path.resolve().is_relative_to(target):
                      raise ValueError('SDK archive path escapes its extraction directory')
                  if (entry.external_attr >> 16) & 0o170000 == 0o120000:
                      raise ValueError('SDK archive contains a symbolic link')
              archive.extractall(target)
          PY
      - name: Configure
        id: configure
        env:
          CXX: ${{ matrix.compiler }}
        shell: bash
        run: |
          if ! [[ "$SDK_MODE" =~ ^(source|archive)$ ]]; then
            echo '::error::REXGRAPH_SDK_MODE must be source or archive.'
            exit 1
          fi
          sdk_root="$RUNNER_TEMP/sdk/rexgraph-cpp/rexgraphcpp"
          if test -d .rfc-source; then
            sdk_root="$GITHUB_WORKSPACE/.rfc-source"
          fi
          sdk_root="$(realpath -e "$sdk_root")"
          printf 'sdk_root=%s\n' "$sdk_root" >> "$GITHUB_OUTPUT"
          if test -f "$sdk_root/lib/cmake/RFC/RFCConfig.cmake"; then
            cmake --preset contracts -DGADGET_USE_INSTALLED_RFC=ON -DCMAKE_PREFIX_PATH="$sdk_root" -DGADGET_ENFORCE_DEPENDENCY_LOCK=ON -DPython3_EXECUTABLE=/usr/bin/python3 -DGADGET_COMPILE_JOBS="$CMAKE_BUILD_PARALLEL_LEVEL" -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          else
            test -f "$sdk_root/CMakeLists.txt"
            cmake --preset contracts -DREXGRAPH_SOURCE_DIR="$sdk_root" -DGADGET_ENFORCE_DEPENDENCY_LOCK=ON -DPython3_EXECUTABLE=/usr/bin/python3 -DGADGET_COMPILE_JOBS="$CMAKE_BUILD_PARALLEL_LEVEL" -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          fi
      - name: Build
        id: build
        run: |
          cmake --build --preset contracts --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"
      - name: Report execution resources
        run: build/presets/cpu/gadget resources
      - name: Test the selected CPU profile
        run: |
          ctest --preset "$CONTRACT_TEST_PRESET" --parallel 2 --output-junit contracts.xml
          printf 'CTest profile: %s\n' "$CONTRACT_TEST_PRESET" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify dependency inputs
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          SDK_ROOT: ${{ steps.configure.outputs.sdk_root }}
        run: python3 tools/check_dependency.py --build build/presets/cpu --rexgraph "$SDK_ROOT" --report build/presets/cpu/dependency.json
      - name: Retain compiled Python consumers
        if: matrix.compiler == 'g++'
        run: >-
          tar -C build/presets/cpu -czf "$RUNNER_TEMP/native-consumers.tar.gz"
          gadget gadget_native_field_import gadget_native_field_query gadget_data_field_tests
          gadget_native_biomedical_fields_tests gadget_result_binding_tests
          examples/source-formats/gadget_source build-info.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.compiler == 'g++'
        with:
          name: native-consumers
          path: ${{ runner.temp }}/native-consumers.tar.gz
          retention-days: 3
      - name: Report compiler cache
        if: always()
        run: ccache --show-stats
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: contracts-${{ matrix.compiler }}
          path: |
            build/presets/cpu/contracts.xml
            build/presets/cpu/build-info.json
            build/presets/cpu/dependency.json
            build/presets/cpu/Testing/Temporary/LastTest.log
  bindings:
    name: Python bindings
    needs: [checks, contracts, python-wheels]
    if: needs.checks.outputs.contracts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CONTRACT_TEST_PRESET: ${{ github.event.inputs.test_preset || 'cpu' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sirtrott1/rexgraph-cpp
          ref: ${{ needs.checks.outputs.revision }}
          path: .rfc-source
          persist-credentials: false
      - name: Install runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ pkg-config libgmp-dev libssl-dev libjson-c-dev libopenblas-dev python3-venv
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-wheels
          path: .cache/native-wheels
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-consumers
          path: ${{ runner.temp }}/native-consumers
      - name: Install the native Python stack
        run: |
          python3 -m venv "$RUNNER_TEMP/gadget-agent"
          "$RUNNER_TEMP/gadget-agent/bin/python" -m pip install .cache/native-wheels/*.whl
          "$RUNNER_TEMP/gadget-agent/bin/python" -m pip install 'rexgraph-rcdb[sql]' './tools/rcdb[agent,native]' pytest h5py
          "$RUNNER_TEMP/gadget-agent/bin/python" -m pip check
      - name: Restore compiled consumers and register binding contracts
        run: |
          mkdir -p build/presets/cpu
          tar -C build/presets/cpu -xzf "$RUNNER_TEMP/native-consumers/native-consumers.tar.gz"
          cp build/presets/cpu/build-info.json "$RUNNER_TEMP/consumer-build-info.json"
          cmake --preset contracts -DREXGRAPH_SOURCE_DIR="$GITHUB_WORKSPACE/.rfc-source" \
            -DGADGET_ENFORCE_DEPENDENCY_LOCK=ON -DPython3_EXECUTABLE=/usr/bin/python3 \
            -DGADGET_TEST_AGENT=ON -DGADGET_TEST_DATA_PYTHON=ON \
            -DGADGET_TEST_NATIVE_PYTHON=ON -DGADGET_TEST_NATIVE_MODELS=ON \
            -DGADGET_TEST_TEMPORAL_PYTHON=OFF \
            -DGADGET_AGENT_PYTHON_EXECUTABLE="$RUNNER_TEMP/gadget-agent/bin/python"
          cmp build/presets/cpu/build-info.json "$RUNNER_TEMP/consumer-build-info.json"
      - name: Test Python bindings with compiled consumers
        run: >-
          ctest --preset "$CONTRACT_TEST_PRESET" --parallel 2 --output-junit bindings.xml
          -R '^gadget_(agent|source_native|data_(capability|journal|binding|io|workflow|native_program)|python_native_stack)_contracts$'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: python-binding-contracts
          path: |
            build/presets/cpu/bindings.xml
            build/presets/cpu/Testing/Temporary/LastTest.log
  qualification:
    name: Native qualification
    needs: [checks, contracts, bindings]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report native acceptance
        env:
          INPUT_RESULT: ${{ needs.checks.result }}
          CONTRACTS_REQUIRED: ${{ needs.checks.outputs.contracts }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          BINDINGS_RESULT: ${{ needs.bindings.result }}
          MATCHING_QUALIFICATION: ${{ needs.checks.outputs.matching_qualification }}
          CONTRACT_TEST_PRESET: ${{ github.event.inputs.test_preset || 'cpu' }}
        run: >-
          python3 tools/ci_checks.py report
          --checks-result "$INPUT_RESULT"
          --required "$CONTRACTS_REQUIRED"
          --contracts-result "$CONTRACTS_RESULT"
          --bindings-result "$BINDINGS_RESULT"
          --matching-qualification "$MATCHING_QUALIFICATION"
          --test-preset "$CONTRACT_TEST_PRESET"
          --summary "$GITHUB_STEP_SUMMARY"
