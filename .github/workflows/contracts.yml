name: C++ contracts

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  MPLBACKEND: Agg

jobs:
  checks:
    name: Inputs and documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      contracts: ${{ steps.plan.outputs.contracts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select native qualification
        id: plan
        env:
          BASE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci_checks.py plan --base "$BASE_SHA" --head "$GITHUB_SHA" --output "$GITHUB_OUTPUT"
      - name: Check CI selection and documentation
        run: |
          python3 tests/ci_checks.py
          python3 tests/publication.py
          python3 tools/check_publication.py --history
          python3 tools/ci_checks.py docs
          python3 tests/dependency.py
          python3 tests/source_export.py "$RUNNER_TEMP/source-export-contracts"
  contracts:
    needs: checks
    if: needs.checks.outputs.contracts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: ${{ vars.GADGET_BUILD_JOBS || '1' }}
      SDK_URL: ${{ vars.REXGRAPH_ARCHIVE_URL || secrets.REXGRAPH_ARCHIVE_URL }}
      SDK_SHA256: ${{ vars.REXGRAPH_ARCHIVE_SHA256 }}
      SDK_REPOSITORY: ${{ vars.REXGRAPH_ARCHIVE_REPOSITORY }}
      SDK_MODE: ${{ vars.REXGRAPH_SDK_MODE || 'source' }}
      SDK_SOURCE_REPOSITORY: ${{ vars.REXGRAPH_SOURCE_REPOSITORY || 'sirtrott1/rexgraph-cpp' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the recorded SDK revision
        id: sdk
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          if os.environ['SDK_MODE'] not in ('source', 'archive'):
              raise ValueError('REXGRAPH_SDK_MODE must be source or archive')
          lock = pathlib.Path('cmake/RexGraph.lock.cmake').read_text()
          revision = re.search(r'GADGET_QUALIFIED_REXGRAPH_REVISION\s+"([0-9a-f]{40})"', lock)
          if revision is None:
              raise ValueError('SDK source revision is missing from the dependency lock')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('revision=' + revision.group(1) + '\n')
          PY
      - name: Retrieve the SDK archive
        if: env.SDK_MODE == 'archive' && env.SDK_REPOSITORY != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.REXGRAPH_ARCHIVE_REPOSITORY }}
          ref: ${{ vars.REXGRAPH_ARCHIVE_REF }}
          ssh-key: ${{ secrets.REXGRAPH_ARCHIVE_DEPLOY_KEY }}
          persist-credentials: false
          path: .rfc-download
      - name: Retrieve the independent SDK source
        if: env.SDK_MODE == 'source'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SDK_SOURCE_REPOSITORY }}
          ref: ${{ vars.REXGRAPH_SOURCE_REF || steps.sdk.outputs.revision }}
          persist-credentials: false
          path: .rfc-source
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ clang pkg-config libgmp-dev libssl-dev libjson-c-dev python3-numpy python3-sympy python3-scipy python3-jsonschema python3-matplotlib
      - name: Check the test environment
        run: /usr/bin/python3 tools/ci_checks.py preflight
      - name: Fetch the qualified SDK
        if: env.SDK_MODE == 'archive'
        shell: bash
        run: |
          if ! [[ "$SDK_SHA256" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo '::error::Configure REXGRAPH_ARCHIVE_SHA256 for the qualified SDK.'
            exit 1
          fi
          if test -n "$SDK_REPOSITORY"; then
            test -f .rfc-download/rexgraph-sdk.zip
            cp .rfc-download/rexgraph-sdk.zip "$RUNNER_TEMP/rexgraph.zip"
            rm -rf .rfc-download
          elif test -n "$SDK_URL"; then
            curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 --output "$RUNNER_TEMP/rexgraph.zip" "$SDK_URL"
          else
            echo '::error::Configure an SDK archive repository or HTTPS archive URL.'
            exit 1
          fi
          printf '%s  %s\n' "$SDK_SHA256" "$RUNNER_TEMP/rexgraph.zip" | sha256sum --check --strict
          python3 - "$RUNNER_TEMP/rexgraph.zip" "$RUNNER_TEMP/sdk" <<'PY'
          import pathlib, sys, zipfile
          target = pathlib.Path(sys.argv[2]).resolve()
          with zipfile.ZipFile(sys.argv[1]) as archive:
              for entry in archive.infolist():
                  path = target / entry.filename
                  if not path.resolve().is_relative_to(target):
                      raise ValueError('SDK archive path escapes its extraction directory')
                  if (entry.external_attr >> 16) & 0o170000 == 0o120000:
                      raise ValueError('SDK archive contains a symbolic link')
              archive.extractall(target)
          PY
      - name: Configure
        id: configure
        env:
          CXX: ${{ matrix.compiler }}
        shell: bash
        run: |
          sdk_root="$RUNNER_TEMP/sdk/rexgraph-cpp/rexgraphcpp"
          if test -d .rfc-source; then
            sdk_root="$GITHUB_WORKSPACE/.rfc-source"
          fi
          sdk_root="$(realpath -e "$sdk_root")"
          printf 'sdk_root=%s\n' "$sdk_root" >> "$GITHUB_OUTPUT"
          if test -f "$sdk_root/lib/cmake/RFC/RFCConfig.cmake"; then
            cmake --preset contracts -DGADGET_USE_INSTALLED_RFC=ON -DCMAKE_PREFIX_PATH="$sdk_root" -DGADGET_ENFORCE_DEPENDENCY_LOCK=ON -DPython3_EXECUTABLE=/usr/bin/python3 -DGADGET_COMPILE_JOBS="$CMAKE_BUILD_PARALLEL_LEVEL"
          else
            test -f "$sdk_root/CMakeLists.txt"
            cmake --preset contracts -DREXGRAPH_SOURCE_DIR="$sdk_root" -DGADGET_ENFORCE_DEPENDENCY_LOCK=ON -DPython3_EXECUTABLE=/usr/bin/python3 -DGADGET_COMPILE_JOBS="$CMAKE_BUILD_PARALLEL_LEVEL"
          fi
      - name: Build
        id: build
        run: |
          cmake --build --preset contracts --target gadget_native --parallel 1
          cmake --build --preset contracts --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"
      - name: Report execution resources
        run: build/presets/cpu/gadget resources
      - name: Test
        run: ctest --preset contracts --parallel 2 --output-junit contracts.xml
      - name: Verify dependency inputs
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          SDK_ROOT: ${{ steps.configure.outputs.sdk_root }}
        run: python3 tools/check_dependency.py --build build/presets/cpu --rexgraph "$SDK_ROOT" --report build/presets/cpu/dependency.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: contracts-${{ matrix.compiler }}
          path: |
            build/presets/cpu/contracts.xml
            build/presets/cpu/build-info.json
            build/presets/cpu/dependency.json
            build/presets/cpu/Testing/Temporary/LastTest.log
