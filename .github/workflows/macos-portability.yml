name: macOS portability

on:
  workflow_dispatch:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: macos-portability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portability:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the recorded SDK revision
        id: sdk
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          lock = pathlib.Path('cmake/RexGraph.lock.cmake').read_text()
          revision = re.search(r'GADGET_QUALIFIED_REXGRAPH_REVISION\s+"([0-9a-f]{40})"', lock)
          if revision is None:
              raise ValueError('SDK source revision is missing from the dependency lock')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('revision=' + revision.group(1) + '\n')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sirtrott1/rexgraph-cpp
          ref: ${{ steps.sdk.outputs.revision }}
          path: .rfc-source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ggml-org/llama.cpp
          # Compatible adapter interface with use_mmap and use_mlock.
          ref: da296d6e726654949bce10d7cae9a2195d292bfc
          path: .llama-source
          persist-credentials: false
      - name: Install build dependencies
        run: brew install ccache cmake ninja pkg-config gmp json-c openssl@3 htslib
      - name: Restore compiler cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: .cache/ccache
          key: compile-${{ runner.os }}-${{ runner.arch }}-appleclang-${{ hashFiles('cmake/RexGraph.lock.cmake') }}-${{ github.sha }}
          restore-keys: |
            compile-${{ runner.os }}-${{ runner.arch }}-appleclang-${{ hashFiles('cmake/RexGraph.lock.cmake') }}-
      - name: Configure all contracts with HTS admission and the local model adapter
        run: >-
          cmake -S . -B "$RUNNER_TEMP/portability" -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS=-fexperimental-library
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DBUILD_TESTING=ON -DGADGET_BUILD_EXAMPLES=ON -DGADGET_ENABLE_HTSLIB=ON
          -DGADGET_ENABLE_LOCAL_MODEL=ON -DGGML_METAL=OFF
          -DLLAMA_SOURCE_DIR="$GITHUB_WORKSPACE/.llama-source"
          -DREXGRAPH_SOURCE_DIR="$GITHUB_WORKSPACE/.rfc-source"
          -DGADGET_ENFORCE_DEPENDENCY_LOCK=ON -DGADGET_COMPILE_JOBS=2
      - name: Build and check native resource admission
        run: |
          cmake --build "$RUNNER_TEMP/portability" --parallel 2 --target gadget gadget_platform_observation_tests
          "$RUNNER_TEMP/portability/gadget" resources
          ctest --test-dir "$RUNNER_TEMP/portability" --output-on-failure --no-tests=error -R '^gadget_platform_observation_contracts$'
      - name: Compile contract sources
        run: |
          python3 - "$RUNNER_TEMP/portability" <<'PY'
          import subprocess, sys
          build = sys.argv[1]
          targets = subprocess.check_output(['ninja', '-C', build, '-t', 'targets', 'all'], text=True)
          objects = [line.split(':', 1)[0] for line in targets.splitlines()
                     if '/tests/' in line.split(':', 1)[0]
                     and line.split(':', 1)[0].endswith('.cpp.o')]
          if not objects:
              raise ValueError('No contract sources were configured')
          subprocess.run(['cmake', '--build', build, '--parallel', '2', '--target', *objects,
                          '--', '-k', '0'], check=True)
          PY
      - name: Compile the core, local model adapter and every contract executable
        run: cmake --build "$RUNNER_TEMP/portability" --parallel 2 -- -k 0
      - name: Exercise native execution, resources, file publication and source formats
        run: >-
          ctest --test-dir "$RUNNER_TEMP/portability" --output-on-failure --no-tests=error
          -R '^gadget_(native_record|platform_observation|memory_observation|execution_resource|assay_intake|genomic_integer_portability|file_publication|count(_reference|_native)?|bindingdb_bulk(_reference)?)_contracts$'
      - name: Report compiler cache
        if: always()
        run: ccache --show-stats
      - name: Retain failed contract diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-contract-diagnostics
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/portability/Testing/Temporary/LastTest.log
            ${{ runner.temp }}/portability/test-data/count-models
